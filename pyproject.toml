[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gr3-grasping"
version = "0.1.0"
description = "Fourier GR3 RGB-D grasping simulation and deployment interfaces"
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.3,<4", "numpy>=2,<3", "scipy>=1.14", "Pillow>=10",
  "PyYAML>=6", "imageio[ffmpeg]>=2.34", "pyzmq>=26", "msgpack>=1", "msgpack-numpy>=0.4.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
perception = ["torch==2.8.0", "torchvision==0.23.0", "transformers==4.57.6"]
m2t2 = ["torch==2.8.0", "omegaconf>=2.3,<3", "trimesh>=4,<5", "huggingface-hub>=0.34,<1"]
oak = ["depthai>=2.30,<3"]

[project.scripts]
gr3-grasp = "gr3_grasping.cli:main"
gr3-deploy = "gr3_grasping.deployment.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cpu", extra = "perception"}, {index = "pytorch-cpu", extra = "m2t2"}]
torchvision = [{index = "pytorch-cpu", extra = "perception"}]
