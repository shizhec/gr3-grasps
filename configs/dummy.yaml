robot:
  urdf: third_party/Wiki-GRx-Models/GRX/GR3/gr3v2_1_1/basic_urdf/gr3v2_1_1_dummy_hand.urdf
  base_height_m: 0.93
  # Official dummy hand has no articulated fingers. Never report a successful grasp.
  hand: dummy
  initial_joints:
    head_pitch_joint: 0.14
    right_elbow_pitch_joint: -0.9
    left_elbow_pitch_joint: -0.9
  # Provisional contact frame; must be calibrated for the real hand.
  tcp_offset_m: [0, 0, -0.10]
  tcp_rotation_rpy: [3.141592653589793, 0, 0]
camera:
  body: camera_link
  width: 640
  height: 480
  # FOV is an assumption, not an official calibrated intrinsic.
  fovy_deg: 75
  depth_noise_std_m: 0.0
  depth_dropout: 0.0
  seed: 7
scene:
  table_top_m: 0.90
  table_center_xy: [0.62, 0.0]
  table_half_size_xy: [0.29, 0.40]
  objects:
    - {name: red_block, type: box, pos: [0.49, -0.19, 0.941], size: [0.025, 0.025, 0.04], rgba: [0.85, 0.12, 0.08, 1], mass: 0.08}
    - {name: blue_cylinder, type: cylinder, pos: [0.62, 0.17, 0.951], size: [0.028, 0.05], rgba: [0.08, 0.30, 0.85, 1], mass: 0.08}
    - {name: yellow_sphere, type: sphere, pos: [0.76, -0.04, 0.931], size: [0.03], rgba: [0.95, 0.68, 0.08, 1], mass: 0.06}
perception:
  workspace_min: [0.34, -0.36, 0.909]
  workspace_max: [0.87, 0.36, 1.20]
  min_pixels: 35
planning:
  pregrasp_distance_m: 0.16
  max_joint_speed_rad_s: 0.35
  max_joint_step_rad: 0.02
  position_tolerance_m: 0.003
  rotation_tolerance_rad: 0.04
  collision_penetration_m: 0.001
graspgen:
  host: 127.0.0.1
  port: 5556
  timeout_ms: 30000
  num_grasps: 80
  topk_num_grasps: 24
